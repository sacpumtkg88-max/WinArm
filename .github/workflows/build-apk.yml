name: Build WinArm APK

on:
workflow_dispatch:
push:
branches:
- main

permissions:
contents: read

jobs:
build:
name: Build Debug APK
runs-on: ubuntu-latest
timeout-minutes: 60

steps:
  - name: Checkout source
    uses: actions/checkout@v4

  - name: Set up JDK 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Set up Android SDK
    uses: android-actions/setup-android@v4

  - name: Install build tools
    run: |
      set -euo pipefail
      sudo apt-get update
      sudo apt-get install -y python3 patchelf binutils xz-utils
      yes | sdkmanager --licenses || true
      sdkmanager --install \
        "platform-tools" \
        "platforms;android-34" \
        "build-tools;34.0.0"

  - name: Verify project files
    run: |
      set -euo pipefail
      test -f settings.gradle.kts
      test -f build.gradle.kts
      test -f app/build.gradle.kts
      test -f tools/fetch_qemu.py

  - name: Fetch QEMU and dependencies
    run: |
      set -euo pipefail

      python3 tools/fetch_qemu.py

      echo "=== QEMU output files ==="
      find out -type f -maxdepth 5 -print

      test -f out/jniLibs/arm64-v8a/libqemu.so

      mkdir -p app/src/main/jniLibs/arm64-v8a

      cp -v out/jniLibs/arm64-v8a/*.so \
        app/src/main/jniLibs/arm64-v8a/

      echo "=== Verify required dependency ==="
      test -f app/src/main/jniLibs/arm64-v8a/lib_libz_so_1_3_2.so

      echo "QEMU and required dependency found."

  - name: Set up Gradle
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: '8.7'

  - name: Verify Java and Gradle
    run: |
      java -version
      gradle --version

  - name: Build Debug APK
    run: gradle --no-daemon --stacktrace assembleDebug

  - name: Verify APK contents
    run: |
      set -euo pipefail

      APK="app/build/outputs/apk/debug/app-debug.apk"

      test -f "$APK"

      echo "=== Check QEMU ==="
      unzip -l "$APK" | grep 'lib/arm64-v8a/libqemu.so'

      echo "=== Check zlib dependency ==="
      unzip -l "$APK" | grep 'lib/arm64-v8a/lib_libz_so_1_3_2.so'

      echo "APK contains QEMU and zlib dependency."

  - name: Upload Debug APK
    uses: actions/upload-artifact@v4
    with:
      name: WinArm-debug-apk
      path: app/build/outputs/apk/debug/*.apk
      if-no-files-found: error
      retention-days: 7
