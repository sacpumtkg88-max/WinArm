name: Build WinArm APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          set -e
          sdkmanager --licenses
          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Verify Android project
        run: |
          set -e
          echo "Checking project files..."
          test -f settings.gradle.kts -o -f settings.gradle
          test -f build.gradle.kts -o -f build.gradle
          test -f app/build.gradle.kts -o -f app/build.gradle
          echo "Android project files found."

      - name: Prepare Gradle wrapper
        run: |
          set -e
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
          elif [ -f gradlew ]; then
            chmod +x gradlew
          else
            echo "::error::Gradle wrapper (gradlew) is missing."
            echo "The project must include gradlew and gradle/wrapper/gradle-wrapper.jar."
            exit 1
          fi

      - name: Build Debug APK
        run: |
          set -e
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: WinArm-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7